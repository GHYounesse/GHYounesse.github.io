name: Deploy to VPS

on:
  push:
    branches: [main]
  # Pull requests only run the checks job: they never get the SSH secrets.
  pull_request:
    branches: [main]
  workflow_dispatch:

# The deploy uses an SSH key from secrets, so the GitHub token itself only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Same fast checks as locally: lint, types, unit tests, then the security tests on a test build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify:fast
      - run: npm run build:test
      - run: npm run test:security

  deploy:
    # A failing check blocks the deploy; pull requests never deploy.
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist/ to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The VPS accepts SSH on port 52222 (port 22 gets closed). ssh and rsync read the port from this config,
          # and ssh-keyscan needs it too, otherwise the host key check fails.
          printf 'Host %s\n  Port 52222\n' "$VPS_HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -H -p 52222 "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$VPS_USER@$VPS_HOST:/var/www/younesghalloum.dev/"
